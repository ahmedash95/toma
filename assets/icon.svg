  <!-- chat bubble -->
  <path d="M300 260 H724 A96 96 0 0 1 820 356 V596 A96 96 0 0 1 724 692 H470 L352 792 Q340 802 340 786 V692 H300 A96 96 0 0 1 204 596 V356 A96 96 0 0 1 300 260 Z"
